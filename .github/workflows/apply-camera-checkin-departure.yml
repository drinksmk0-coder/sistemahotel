name: Apply camera check-in and departure

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-camera-checkin-departure.mjs
      - .github/workflows/apply-camera-checkin-departure.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply requested changes
        run: node scripts/patch-camera-checkin-departure.mjs
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GuestFormScanner.tsx src/routes/_authenticated/reservas.tsx supabase/functions/scan-guest-form/index.ts
          git commit -m "melhora scanner de ficha e restaura saída do hóspede"
          git push origin HEAD:main
