name: Finalize current release

on:
  push:
    branches:
      - agent/versao-escolhida-integrada-final
    paths:
      - scripts/finalize-current-release.mjs
      - .github/workflows/finalize-current-release.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consolidated branch
        uses: actions/checkout@v4
        with:
          ref: agent/versao-escolhida-integrada-final
          fetch-depth: 0

      - name: Apply release corrections
        run: node scripts/finalize-current-release.mjs

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run build

      - name: Commit validated corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/reservas.tsx src/components/AppLayout.tsx src/routes/_authenticated/dashboard-estrategico.tsx
          if ! git diff --cached --quiet; then
            git commit -m "remove dashboard duplicado e consolida correções atuais"
          fi

      - name: Update consolidated branch
        run: git push origin HEAD:agent/versao-escolhida-integrada-final

      - name: Publish validated version to production branch
        run: git push origin HEAD:main
