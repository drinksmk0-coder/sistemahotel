name: Apply guest privacy hardening

on:
  push:
    branches:
      - preview/reservas-responsive-v2
    paths:
      - scripts/apply-guest-privacy-hardening.mjs
      - .github/workflows/apply-guest-privacy-hardening.yml

permissions:
  contents: write

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/reservas-responsive-v2
          fetch-depth: 0
      - name: Apply CPF privacy rules
        run: node scripts/apply-guest-privacy-hardening.mjs
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit protected UI
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/clientes.tsx src/routes/_authenticated/fichas-checkin.tsx src/routes/checkin-print.tsx
          git commit -m "preview: protege CPF e usa ID interno do hospede"
          git push origin HEAD:preview/reservas-responsive-v2
