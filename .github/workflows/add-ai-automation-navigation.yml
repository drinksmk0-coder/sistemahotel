name: Add AI automation navigation

on:
  push:
    branches:
      - agent/versao-escolhida-integrada-final
    paths-ignore:
      - docs/**

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/versao-escolhida-integrada-final
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add protected navigation entry
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/components/AppLayout.tsx';
          let source = fs.readFileSync(path, 'utf8');
          if (!source.includes('to: "/automacoes-ia"')) {
            const marker = `  {\n    to: "/integracoes",\n    label: "Integrações",`;
            const entry = `  {\n    to: "/automacoes-ia",\n    label: "Automações com IA",\n    icon: Bot,\n    roles: ["dono"],\n    group: "Inteligência",\n  },\n`;
            if (!source.includes(marker)) throw new Error('Ponto de inserção do menu não encontrado');
            source = source.replace(marker, entry + marker);
            fs.writeFileSync(path, source);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Build
        run: npm run build

      - name: Commit validated change
        run: |
          if git diff --quiet; then
            echo "Navigation already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AppLayout.tsx
          git commit -m "expõe central de automações IA no menu do proprietário"
          git push origin HEAD:agent/versao-escolhida-integrada-final
