name: Sync main and validate release

on:
  push:
    branches:
      - agent/versao-escolhida-integrada-final
    paths:
      - .github/workflows/sync-main-and-validate-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/versao-escolhida-integrada-final
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Merge main preserving validated release conflicts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit -X ours origin/main
          git checkout HEAD^1 -- src/routes/_authenticated/vendas.tsx
          git add src/routes/_authenticated/vendas.tsx
          git commit --amend --no-edit

      - name: Install dependencies
        run: npm ci

      - name: Validate operational invariants
        run: node scripts/validate-operational-flow.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Push synchronized validated branch
        run: git push origin HEAD:agent/versao-escolhida-integrada-final
