name: Patch owner-only HotelAI

on:
  push:
    branches:
      - agent/importar-hospedin-relatorio-agua

permissions:
  contents: write

concurrency:
  group: owner-only-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/importar-hospedin-relatorio-agua
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply permission patch
        run: node scripts/patch-owner-only.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Commit permission patch
        run: |
          git add src/routes/_authenticated/assistente.tsx supabase/functions/hotel-assistant-v2/index.ts
          if [ -f src/routeTree.gen.ts ]; then
            git add -f src/routeTree.gen.ts
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "restringir HotelAI analítico ao proprietário"
          git push origin HEAD:agent/importar-hospedin-relatorio-agua
