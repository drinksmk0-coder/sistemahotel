name: Fix room actions and sale deletion

on:
  push:
    branches:
      - agent/versao-escolhida-integrada-final
    paths:
      - scripts/fix-room-actions-delete-runtime.mjs
      - .github/workflows/fix-room-actions-delete-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/versao-escolhida-integrada-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fix-room-actions-delete-runtime.mjs
      - run: npm run typecheck
      - run: npm run build
      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/MapaQuartos.tsx src/routes/_authenticated/vendas.tsx
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "corrige duplicidade de ações e exclusão de comandas"
          git push origin HEAD:agent/versao-escolhida-integrada-final
