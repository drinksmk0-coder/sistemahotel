name: Apply WhatsApp QR pilot

on:
  push:
    branches:
      - preview/whatsapp-qr-pilot
    paths:
      - scripts/apply-whatsapp-qr-pilot.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: preview/whatsapp-qr-pilot
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply UI and package patch
        run: node scripts/apply-whatsapp-qr-pilot.mjs

      - name: Install QR bridge dependency
        run: npm install --save-exact @whiskeysockets/baileys@7.0.0-rc13

      - name: Validate build
        run: npm run build

      - name: Commit validated pilot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/whatsapp-ia.tsx package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "preview: habilita piloto QR do WhatsApp IA"
            git push origin preview/whatsapp-qr-pilot
          fi
