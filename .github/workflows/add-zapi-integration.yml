name: Add Z-API integration

on:
  workflow_dispatch:
  push:
    branches:
      - agent/versao-escolhida-integrada-final
    paths:
      - 'src/components/ZApiIntegrationPanel.tsx'
      - 'supabase/functions/zapi-admin/index.ts'
      - 'supabase/migrations/20260805213000_zapi_secure_integration.sql'
      - 'scripts/add-zapi-panel.mjs'
      - '.github/workflows/add-zapi-integration.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/versao-escolhida-integrada-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/add-zapi-panel.mjs
      - run: npm run typecheck
      - run: npm run build
      - name: Commit panel integration
        run: |
          if git diff --quiet -- src/routes/_authenticated/integracoes.tsx; then
            echo "Painel já integrado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/integracoes.tsx
          git commit -m "feat: exibe configuração e QR Code Z-API em Integrações"
          git pull --rebase origin agent/versao-escolhida-integrada-final
          git push origin HEAD:agent/versao-escolhida-integrada-final
