name: Validar SistemaHotel

on:
  push:
    branches:
      - main
      - agent/versao-final-zero-scroll
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar estrutura e compilar
        run: npm run build
