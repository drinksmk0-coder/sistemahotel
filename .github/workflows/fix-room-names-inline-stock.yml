name: Fix room names and inventory totals

on:
  push:
    branches:
      - fix/vendas-exclusao-estoque-busca
    paths:
      - .github/workflows/fix-room-names-inline-stock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vendas-exclusao-estoque-busca
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply focused corrections
        shell: bash
        run: |
          echo '' | base64 --decode | gzip --decompress > /tmp/fix-room-names-inline-stock.mjs
          node /tmp/fix-room-names-inline-stock.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit validated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data.ts src/components/MapaQuartos.tsx src/routes/_authenticated/clientes.tsx src/routes/_authenticated/vendas.tsx
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "corrige nomes do mapa e totais de estoque"
          git fetch origin fix/vendas-exclusao-estoque-busca
          git rebase origin/fix/vendas-exclusao-estoque-busca
          git push origin HEAD:fix/vendas-exclusao-estoque-busca
