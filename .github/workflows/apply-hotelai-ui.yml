name: Validate PR 25 build

on:
  push:
    branches:
      - agent/importar-hospedin-relatorio-agua
    paths:
      - src/**
      - supabase/functions/hotel-assistant-v2/**
      - .github/workflows/apply-hotelai-ui.yml
  pull_request:
    branches:
      - agent/finalizar-fluxos-hospedamais

permissions:
  contents: read

concurrency:
  group: pr25-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck
