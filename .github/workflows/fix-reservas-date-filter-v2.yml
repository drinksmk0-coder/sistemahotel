name: Fix reservas date filter v2

on:
  push:
    branches:
      - agent/versao-escolhida-integrada-final
    paths:
      - scripts/fix-reservas-date-filter-v2.mjs
      - .github/workflows/fix-reservas-date-filter-v2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/versao-escolhida-integrada-final
          fetch-depth: 0
      - run: node scripts/fix-reservas-date-filter-v2.mjs
      - name: Commit correction
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/reservas.tsx
          git commit -m "corrige definitivamente filtro de data em reservas"
          git push origin HEAD:agent/versao-escolhida-integrada-final
      - run: npm ci
      - run: npm run build
