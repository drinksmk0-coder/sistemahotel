name: Promote Booking integration

on:
  push:
    branches: [main]
    paths: ['.github/workflows/promote-booking-integration.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch final branch
        run: git fetch origin agent/versao-escolhida-integrada-final

      - name: Copy Booking integration files
        run: |
          git checkout origin/agent/versao-escolhida-integrada-final -- \
            booking-chrome-extension \
            public/booking-extension-install.html \
            src/routes/_authenticated/integracoes.tsx

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit promoted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add booking-chrome-extension public/booking-extension-install.html src/routes/_authenticated/integracoes.tsx
          if git diff --cached --quiet; then
            echo 'No changes to promote'
            exit 0
          fi
          git commit -m 'feat: publica integração Booking no sistema'
          git push origin main
