name: Apply reservation flow updates

on:
  push:
    branches:
      - agent/importar-hospedin-relatorio-agua
    paths:
      - scripts/apply-reservation-flow-updates.mjs
      - .github/workflows/apply-reservation-flow-updates.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/importar-hospedin-relatorio-agua
          fetch-depth: 0

      - name: Apply targeted updates
        run: node scripts/apply-reservation-flow-updates.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run build

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/reservas.tsx src/lib/data.ts src/components/ReservaForm.tsx
          git commit -m "corrigir check-in, faturamento e saídas pendentes"
          git push origin HEAD:agent/importar-hospedin-relatorio-agua
