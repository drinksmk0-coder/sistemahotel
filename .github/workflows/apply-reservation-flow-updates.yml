name: Validate reservation flow updates

on:
  push:
    branches:
      - agent/importar-hospedin-relatorio-agua
  pull_request:
    branches:
      - agent/finalizar-fluxos-hospedamais

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: reservation-flow-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
