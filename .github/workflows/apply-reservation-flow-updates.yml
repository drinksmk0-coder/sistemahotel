name: Validate reservation flow updates

on:
  push:
    branches:
      - agent/importar-hospedin-relatorio-agua

permissions:
  contents: write

concurrency:
  group: reservation-flow-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/importar-hospedin-relatorio-agua
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply idempotent build fixes
        run: node scripts/fix-pr25-build.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build and regenerate routes
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Commit generated corrections
        run: |
          git add src/components/MapaQuartos.tsx
          if [ -f src/routeTree.gen.ts ]; then
            git add -f src/routeTree.gen.ts
          fi
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "corrigir consumo no mapa e regenerar rotas"
          git push origin HEAD:agent/importar-hospedin-relatorio-agua
