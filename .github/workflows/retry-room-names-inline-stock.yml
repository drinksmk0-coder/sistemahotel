name: Retry room names and inventory totals

on:
  push:
    branches:
      - fix/vendas-exclusao-estoque-busca
    paths:
      - .github/workflows/retry-room-names-inline-stock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vendas-exclusao-estoque-busca
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reapply focused corrections
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import pathlib
          import re

          workflow = pathlib.Path('.github/workflows/fix-room-names-inline-stock.yml').read_text()
          match = re.search(r"echo '([^']+)' \| base64", workflow)
          if not match:
              raise SystemExit('Payload de correção não encontrado')
          script = gzip.decompress(base64.b64decode(match.group(1)))
          pathlib.Path('/tmp/fix-room-names-inline-stock.mjs').write_bytes(script)
          PY
          node /tmp/fix-room-names-inline-stock.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Compile application directly
        run: npx vite build
      - name: Commit validated source files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data.ts src/components/MapaQuartos.tsx src/routes/_authenticated/clientes.tsx src/routes/_authenticated/vendas.tsx
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "corrige nomes, edicao direta e valor do estoque"
          git fetch origin fix/vendas-exclusao-estoque-busca
          git rebase origin/fix/vendas-exclusao-estoque-busca
          git push origin HEAD:fix/vendas-exclusao-estoque-busca
